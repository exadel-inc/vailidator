<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AEM Audit — Test Page</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: #eef1f4;
      color: #1d1d1d;
    }

    .test-shell-header h1 {
      margin: 0 0 4px;
      font-size: 20px;
    }

    .test-shell-header p {
      margin: 4px 0;
      font-size: 14px;
      color: #4b5563;
    }

    /* The preview iframe simulates the AEM content frame the loader reads markup from. */
    #ContentFrame {
      width: 100%;
      height: calc(100vh - 150px);
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #ffffff;
    }
  </style>
</head>
<body>
  <header class="test-shell-header">
    <h1>AEM Audit — Test Page</h1>
    <p>
      Use this page to test audits without spending LLM tokens on a real AEM author instance.
      The preview below simulates the AEM content iframe.
    </p>
    <p>
      The <strong>🔍 Audit ▾</strong> button is injected by the loader. Open
      <strong>Settings → Rules</strong> to edit validation rules, then click <strong>Audit</strong>.
    </p>
  </header>

  <iframe id="ContentFrame" title="Page preview"></iframe>

  <script>
    // Sample page markup written into the preview iframe, simulating AEM preview content.
    // Contains a hero, a visible phone number, nav links, and a few intentional issues
    // (broken link, image without alt text) so audits produce meaningful findings.
    const sampleMarkup = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sunny Days Travel — Book Your Next Trip</title>
  <meta name="description" content="Sunny Days Travel offers curated holiday packages, flights, and hotels worldwide.">
</head>
<body>
  <header>
    <nav aria-label="Main navigation">
      <a href="#home">Home</a>
      <a href="#destinations">Destinations</a>
      <a href="#about">About</a>
    </nav>
    <p class="header-phone">Call us now: <a href="tel:+15550100123">+1 (555) 010-0123</a></p>
  </header>

  <main>
    <section id="home" class="hero">
      <h1>Book Your Dream Vacation Today</h1>
      <p>Hand-picked holiday packages to sunny destinations with 24/7 support.</p>
      <a class="cta-button" href="#destinations">Browse Packages</a>
    </section>

    <section id="destinations">
      <h2>Popular Destinations</h2>
      <ul>
        <li><a href="/destinations/maldives.html">Maldives</a></li>
        <li><a href="/destinations/bali.html">Bali</a></li>
        <li><a href="/destinations/broken.html">Santorini</a></li>
      </ul>
    </section>

    <section id="about">
      <h2>Why Choose Us</h2>
      <p>Best price guarantee, flexible booking, and award-winning customer service.</p>
      <img src="/images/team.jpg" alt="">
    </section>
  </main>

  <footer id="contact">
    <p>&copy; 2026 Sunny Days Travel</p>
    <p>Phone: <span>+1 (555) 010-0123</span></p>
  </footer>
</body>
</html>
`;

    const frame = document.getElementById('ContentFrame');
    frame.contentDocument.open();
    frame.contentDocument.write(sampleMarkup);
    frame.contentDocument.close();
  </script>

  <script src="/ui-assets/loader.js"></script>
</body>
</html>
